plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'in.sunilpaulmathew.batteryplus'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "in.sunilpaulmathew.batteryplus"
        minSdk 26
        targetSdk 37
        versionCode 4
        versionName "beta-v0.4"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            optimization {
                enable true
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.material
    implementation libs.preference
}